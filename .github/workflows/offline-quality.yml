name: Offline Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q app tests
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=65
      - run: python -m app.scripts.validate_openapi
      - run: python -m app.scripts.validate_plan_quality
      - run: python -m app.scripts.benchmark_plan
      - run: test -f 'docs/第22期-计划执行治理与工程化闭环.md'
      - run: test -f 'docs/第23期-可信确认与统一工具执行.md'
      - run: test -f 'docs/第24期-工单并发唯一约束与业务幂等.md'
      - run: test -f 'docs/第25期-可恢复的异步Agent任务执行.md'
      - run: test -f 'docs/第26期-HTTP业务沙箱与退款对账.md'

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xc_sx_agent
          POSTGRES_USER: xc_agent
          POSTGRES_PASSWORD: xc_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xc_agent -d xc_sx_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        database:
          - sqlite:////tmp/xc-stage22.db
          - postgresql+psycopg://xc_agent:xc_agent_test@127.0.0.1:5432/xc_sx_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database upgrade
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.manage_migrations upgrade
      - name: Migration drift
        env:
          DATABASE_URL: ${{ matrix.database }}
        run: alembic check
      - name: Governance, case creation, worker queue and refund delivery smoke
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.database_smoke
      - name: Platform SQL contracts
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.platform_smoke
      - name: Reversible downgrade and re-upgrade
        env:
          DATABASE_URL: ${{ matrix.database }}
        run: |
          python -m app.scripts.manage_migrations downgrade --revision base
          python -m app.scripts.manage_migrations upgrade

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pip-audit cyclonedx-bom
      - name: Audit supported dependency ranges
        run: pip-audit -r requirements.txt
      - name: Audit exact deployment dependencies
        run: pip-audit -r requirements-lock.txt
      - run: cyclonedx-py requirements requirements-lock.txt --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage22-sbom
          path: sbom.json
      - run: docker build -t xc-sx-agent:stage22 .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xc-sx-agent:stage22
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "0"
      - run: python -m app.scripts.validate_trivy_report trivy-results.json

  platform-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_E2E=1 python -m unittest tests.test_platform_http
      - run: python -m app.scripts.benchmark_platform --output test-results/capacity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-acceptance
          path: test-results/

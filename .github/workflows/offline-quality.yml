name: Offline Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q app tests
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=65
      - run: python -m app.scripts.validate_openapi
      - run: python -m app.scripts.validate_docs
      - run: python -m app.scripts.validate_plan_quality
      - run: python -m app.scripts.benchmark_plan

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xc_sx_agent
          POSTGRES_USER: xc_agent
          POSTGRES_PASSWORD: xc_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xc_agent -d xc_sx_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        database:
          - sqlite:////tmp/ecom-service-agent-ci.db
          - postgresql+psycopg://xc_agent:xc_agent_test@127.0.0.1:5432/xc_sx_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database upgrade
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.manage_migrations upgrade
      - name: Migration drift
        env:
          DATABASE_URL: ${{ matrix.database }}
        run: alembic check
      - name: Governance, case creation, worker queue and refund delivery smoke
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.database_smoke
      - name: Platform SQL contracts
        env:
          DATABASE_URL: ${{ matrix.database }}
          DATABASE_AUTO_CREATE: "false"
        run: python -m app.scripts.platform_smoke
      - name: Reversible downgrade and re-upgrade
        env:
          DATABASE_URL: ${{ matrix.database }}
        run: |
          python -m app.scripts.manage_migrations downgrade --revision base
          python -m app.scripts.manage_migrations upgrade

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pip-audit cyclonedx-bom
      - name: Audit supported dependency ranges
        run: pip-audit -r requirements.txt
      - name: Audit exact deployment dependencies
        run: pip-audit -r requirements-lock.txt
      - run: cyclonedx-py requirements requirements-lock.txt --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom
          path: sbom.json
      - run: docker build -t ecom-service-agent:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecom-service-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "0"
      - run: python -m app.scripts.validate_trivy_report trivy-results.json

  platform-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_E2E=1 python -m unittest tests.test_platform_http tests.test_browser_retries
      - run: python -m app.scripts.benchmark_platform --output test-results/capacity.json
      - run: python -m app.scripts.drill_platform --output test-results/drills.json
      - run: python -m app.scripts.review_evaluation --output test-results/offline-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-acceptance
          path: test-results/

  compose-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: PostgreSQL 17 recovery client
        run: |
          # PGDG provides the matching client; Ubuntu's default repository may only ship 16.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Full isolated deployment and recovery
        run: python -m app.scripts.accept_deployment --output test-results/deployment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-deployment-evidence
          path: test-results/

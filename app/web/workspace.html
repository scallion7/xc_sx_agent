<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户服务 · Agent 工作台</title><link rel="stylesheet" href="/assets/platform.css"></head><body>
<header><div><small>ECOM SERVICE AGENT</small><h1>客户服务</h1></div><nav><a href="/workbench">人工工作台</a><a href="/docs">API 文档</a></nav></header>
<main><section class="wide"><div class="row"><input id="token" type="password" aria-label="访问令牌" placeholder="访问令牌"><input id="session" aria-label="会话编号" value="demo"><button id="connect">连接会话</button><span id="ownership" class="muted">尚未连接</span></div><div id="status" class="status" role="status">输入访问令牌后开始。敏感操作需要单独确认。</div></section>
<section><h2>对话与执行进度</h2><div id="conversation" aria-live="polite"></div><label for="message">发送消息</label><textarea id="message" placeholder="说明订单号与需要的帮助"></textarea><div class="row"><button id="send">发送</button><button id="cancel" class="secondary">取消当前任务</button><button id="reconnect" class="secondary">恢复进度</button></div><details><summary>任务事件</summary><pre id="events"></pre></details></section>
<section><h2>待确认操作</h2><p class="muted">请核对具体参数。确认仅对此次操作有效。</p><div id="actions"></div><h2>人工消息</h2><div id="human"></div></section>
<section><h2>订单与售后</h2><div class="row"><input id="order" placeholder="订单号" aria-label="订单号"><button id="queryOrder">查询订单</button></div><pre id="orderResult"></pre><div class="row"><input id="case" placeholder="工单号" aria-label="工单号"><button id="queryCase">查询退款结果</button></div><pre id="caseResult"></pre></section>
<section><h2>政策证据</h2><div class="row"><input id="query" placeholder="政策问题" aria-label="政策问题"><button id="search">检索</button></div><div id="citations"></div></section></main><script src="/assets/workspace.js"></script></body></html>

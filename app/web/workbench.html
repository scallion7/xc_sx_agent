<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecom Service Agent · 客服工作台</title><link rel="stylesheet" href="/assets/platform.css"></head><body><header><div><small>Ecom Service Agent</small><h1>客服工作台</h1></div><nav><a href="/workspace">客户服务</a><a href="/admin">运行管理台</a></nav></header><main>
<section class="wide"><div class="row"><input id="token" type="password" aria-label="管理员令牌" placeholder="管理员令牌"><button id="refresh">刷新待办</button></div><div id="status" class="status" role="status">使用管理员身份查看待办和发布状态。</div></section>
<section><h2>会话接管</h2><div id="conversations"></div><label for="user">用户</label><input id="user" value="user-1"><label for="session">会话</label><input id="session" value="demo"><label for="reply">人工回复</label><textarea id="reply"></textarea><button id="sendHuman">发送人工回复</button><h2>操作草稿修订</h2><p class="muted">接管会话后可修改草稿。参数改变会使旧确认失效，释放后须重新提案、重新确认。</p><div id="drafts"></div><h2>售后审批</h2><div id="cases"></div></section>
<section><h2>知识导入与发布</h2><input id="document" placeholder="文档 ID" value="policy-demo"><input id="file" type="file" accept=".md,.txt,.pdf"><label for="metadata">文档适用范围</label><textarea id="metadata">{"title":"演示政策","policy_type":"after_sale","regions":[],"channels":[],"products":[],"effective_date":"2026-01-01","source":"人工导入演示","version":"1"}</textarea><button id="import">导入文档</button><label for="versions">发布包含的文档版本 ID（每行一个）</label><textarea id="versions"></textarea><label for="compare">对比版本 ID（可选）</label><input id="compare"><button id="preview">预览首个文档版本 / 差异</button><pre id="previewResult"></pre><button id="build">构建发布版本</button><label for="release">发布版本 ID</label><input id="release"><button id="activate">激活 / 回滚到此版本</button><button id="withdraw" class="secondary">撤回当前发布</button><details><summary>文档、版本及导入进度</summary><pre id="knowledge"></pre></details></section>
<section><h2>任务与 Trace</h2><input id="trace" placeholder="Trace ID"><button id="loadTrace">查看追踪</button><pre id="traceResult"></pre></section><section><h2>模型成本与系统指标</h2><button id="metrics">刷新指标</button><pre id="metricsResult"></pre></section></main><script src="/assets/workbench.js"></script></body></html>
